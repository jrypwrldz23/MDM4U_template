<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travail 2.1 – MDM4U</title>

  <!-- Feuilles de style du gabarit -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-teal.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    /* ===== Couleurs ===== */
    :root {
      --teal: #009688;
      --teal-fonce: #00796b;
      --rose: #e91e63;
      --texte: #1f2933;
      --gris: #5f6b76;
      --fond: #f4f7f7;
      --ombre: 0 2px 10px rgba(0, 0, 0, .08);
    }

    html { scroll-behavior: smooth; }
    body { font-family: "Roboto", sans-serif; background: var(--fond); color: var(--texte); line-height: 1.6; }
    .w3-bar-block .w3-bar-item { padding: 16px; font-weight: bold; }

    /* Page active dans le menu */
    #mySidebar a.actif { background: #e0f2f1 !important; border-left: 5px solid var(--teal); color: var(--teal-fonce); }

    /* Barre de progression de lecture */
    #progression { position: fixed; top: 0; left: 0; height: 4px; width: 0; background: var(--rose); z-index: 10; }

    /* En-tête */
    .entete { padding: 64px 32px 48px !important; }
    .entete .petit-titre { text-transform: uppercase; letter-spacing: .12em; font-size: .85rem; opacity: .85; margin: 0; }
    .entete h1 { margin: 4px 0 8px; }
    .entete .intro { max-width: 700px; font-size: 1.1rem; margin: 0; }

    /* Contenu */
    .contenu { padding: 32px; max-width: 1100px; }
    .carte { background: #fff; border-radius: 12px; box-shadow: var(--ombre); padding: 24px; margin-bottom: 24px; }
    .carte h2 { margin-top: 0; color: var(--teal-fonce); }
    .gris { color: var(--gris); }

    /* Galerie des graphiques */
    .galerie { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 700px) { .galerie { grid-template-columns: 1fr; } }
    .galerie figure { margin: 0; background: #fff; border-radius: 12px; box-shadow: var(--ombre); overflow: hidden; }
    .galerie img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; cursor: zoom-in; transition: transform .3s; }
    .galerie figure:hover img { transform: scale(1.05); }
    .galerie figcaption { padding: 10px 14px; color: var(--gris); }

    /* Visionneuse (image agrandie) */
    .visionneuse { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); display: none; align-items: center; justify-content: center; z-index: 50; }
    .visionneuse.ouverte { display: flex; }
    .visionneuse img { max-width: 92vw; max-height: 82vh; border-radius: 6px; background: #fff; }
    .visionneuse .legende { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #fff; }
    .visionneuse button { position: absolute; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .15); color: #fff; font-size: 28px; cursor: pointer; }
    .visionneuse button:hover { background: rgba(255, 255, 255, .3); }
    .btn-fermer { top: 16px; right: 16px; }
    .btn-prec { left: 16px; }
    .btn-suiv { right: 16px; }

    /* Boutons page précédente / suivante */
    .nav-pages { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
    .bouton { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--rose); color: #fff !important; text-decoration: none; font-weight: 500; transition: transform .15s; }
    .bouton:hover { transform: translateY(-2px); }
    .bouton.contour { background: transparent; border: 2px solid var(--teal); color: var(--teal-fonce) !important; }

    /* Bouton retour en haut */
    #retourHaut { position: fixed; right: 20px; bottom: 20px; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--teal); color: #fff; font-size: 20px; box-shadow: var(--ombre); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
    #retourHaut.visible { opacity: 1; pointer-events: auto; }

    /* Apparition au défilement */
    .apparait { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s; }
    .apparait.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .apparait { opacity: 1; transform: none; transition: none; }
    }

    /* Téléphone */
    @media (max-width: 600px) {
      .contenu { padding: 16px; }
      .entete { padding: 56px 16px 32px !important; }
    }
  </style>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
</head>

<body>

  <div id="progression"></div>

  <!-- ===== Barre de navigation (chargée depuis nav.html) ===== -->
  <div id="nav-placeholder"></div>
  <script>
    $(function () {
      $("#nav-placeholder").load("nav.html", function () {
        // Met en évidence la page actuelle dans le menu
        $('#mySidebar a[href="module2-1.html"]').addClass("actif");
      });
    });
  </script>

  <div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" id="myOverlay"></div>

  <div class="w3-main" style="margin-left:250px;">

    <!-- Barre du haut (menu sur téléphone) -->
    <div id="myTop" class="w3-container w3-top w3-theme w3-large">
      <p>
        <i class="fa fa-bars w3-button w3-teal w3-hide-large w3-xlarge" onclick="w3_open()" aria-label="Ouvrir le menu"></i>
        <span id="myIntro" class="w3-hide">MDM4U – Travail 2.1</span>
      </p>
    </div>

    <!-- ===== En-tête ===== -->
    <header class="w3-container w3-theme entete">
      <p class="petit-titre">Module 2 · 2.1</p>
      <h1 class="w3-xxxlarge">Travail 2.1</h1>
      <p class="intro">Mes histogrammes construits avec Desmos.</p>
    </header>

    <!-- ===== Contenu ===== -->
    <main class="contenu">

      <section class="carte apparait">
        <h2><i class="fa fa-bar-chart"></i> Mes graphiques Desmos</h2>
        <p class="gris">Clique sur un graphique pour l’agrandir. Utilise les flèches ← → pour naviguer et Échap pour fermer.</p>

        <div class="galerie">
          <figure>
            <img src="desmos-graph%20(1).png" alt="Graphique Desmos 1" loading="lazy">
            <figcaption>Graphique 1</figcaption>
          </figure>
          <figure>
            <img src="desmos-graph%20(2).png" alt="Graphique Desmos 2" loading="lazy">
            <figcaption>Graphique 2</figcaption>
          </figure>
          <figure>
            <img src="desmos-graph%20(3).png" alt="Graphique Desmos 3" loading="lazy">
            <figcaption>Graphique 3</figcaption>
          </figure>
          <figure>
            <img src="desmos-graph%20(4).png" alt="Graphique Desmos 4" loading="lazy">
            <figcaption>Graphique 4</figcaption>
          </figure>
        </div>
      </section>

      <!-- À COMPLÉTER : enlève cette ligne et la dernière ligne du bloc, puis écris ta réflexion
      <section class="carte apparait">
        <h2><i class="fa fa-lightbulb-o"></i> Ce que j'ai appris</h2>
        <p>Écris ici ce que tu as appris dans ce travail.</p>
      </section>
      -->

      <!-- Boutons page précédente / suivante -->
      <nav class="nav-pages" aria-label="Pages précédente et suivante">
        <a class="bouton contour" href="module1-4.html">&larr; 1.4</a>
        <a class="bouton" href="module2-2.html">2.2 &rarr;</a>
      </nav>

    </main>

    <!-- ===== Pied de page ===== -->
    <footer class="w3-container w3-theme" style="padding:32px">
      <p>Contenu de cette page web par Jimi</p>
    </footer>

  </div>

  <!-- Visionneuse d'images -->
  <div class="visionneuse" id="visionneuse" role="dialog" aria-modal="true">
    <button class="btn-fermer" aria-label="Fermer">&times;</button>
    <button class="btn-prec" aria-label="Image précédente">&#8249;</button>
    <img alt="">
    <button class="btn-suiv" aria-label="Image suivante">&#8250;</button>
    <div class="legende"></div>
  </div>

  <button id="retourHaut" aria-label="Retour en haut">&#8679;</button>

  <script>
    // ===== Menu sur téléphone =====
    function w3_open() {
      document.getElementById("mySidebar").style.display = "block";
      document.getElementById("myOverlay").style.display = "block";
    }
    function w3_close() {
      document.getElementById("mySidebar").style.display = "none";
      document.getElementById("myOverlay").style.display = "none";
    }

    // ===== Défilement : barre du haut, progression, bouton retour =====
    var retourHaut = document.getElementById("retourHaut");
    retourHaut.onclick = function () { window.scrollTo({ top: 0 }); };

    window.addEventListener("scroll", function () {
      var y = document.documentElement.scrollTop || document.body.scrollTop;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById("progression").style.width = (max > 0 ? y / max * 100 : 0) + "%";
      retourHaut.classList.toggle("visible", y > 400);
      document.getElementById("myTop").classList.toggle("w3-card-4", y > 80);
      document.getElementById("myIntro").classList.toggle("w3-show-inline-block", y > 80);
    });

    // ===== Apparition des sections au défilement =====
    var sections = document.querySelectorAll(".apparait");
    if ("IntersectionObserver" in window) {
      var obs = new IntersectionObserver(function (entrees) {
        entrees.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      sections.forEach(function (s) { obs.observe(s); });
    } else {
      sections.forEach(function (s) { s.classList.add("visible"); });
    }

    // ===== Visionneuse : agrandir les graphiques =====
    var images = document.querySelectorAll(".galerie img");
    var vis = document.getElementById("visionneuse");
    var grande = vis.querySelector("img");
    var legende = vis.querySelector(".legende");
    var index = 0;

    function montrer(n) {
      index = (n + images.length) % images.length;
      grande.src = images[index].src;
      grande.alt = images[index].alt;
      legende.textContent = images[index].nextElementSibling.textContent + " (" + (index + 1) + "/" + images.length + ")";
      vis.classList.add("ouverte");
    }
    function fermer() { vis.classList.remove("ouverte"); }

    images.forEach(function (img, n) {
      img.tabIndex = 0;
      img.addEventListener("click", function () { montrer(n); });
      img.addEventListener("keydown", function (e) { if (e.key === "Enter") montrer(n); });
    });
    vis.querySelector(".btn-fermer").onclick = fermer;
    vis.querySelector(".btn-prec").onclick = function () { montrer(index - 1); };
    vis.querySelector(".btn-suiv").onclick = function () { montrer(index + 1); };
    vis.addEventListener("click", function (e) { if (e.target === vis) fermer(); });
    document.addEventListener("keydown", function (e) {
      if (!vis.classList.contains("ouverte")) return;
      if (e.key === "Escape") fermer();
      if (e.key === "ArrowLeft") montrer(index - 1);
      if (e.key === "ArrowRight") montrer(index + 1);
    });
  </script>

</body>
</html>
