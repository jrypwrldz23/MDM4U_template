<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travail 2.4 – MDM4U</title>

  <!-- Feuilles de style du gabarit -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-teal.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    :root { --teal: #009688; --teal-fonce: #00796b; --rose: #e91e63; --gris: #5f6b76; --fond: #f4f7f7; }

    body { font-family: "Roboto", sans-serif; background: var(--fond); line-height: 1.6; }
    .w3-bar-block .w3-bar-item { padding: 16px; font-weight: bold; }
    #mySidebar a.actif { background: #e0f2f1 !important; border-left: 5px solid var(--teal); }

    .contenu { padding: 32px; max-width: 1000px; }
    .carte { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 24px; margin-bottom: 24px; }
    .carte h2 { margin-top: 0; color: var(--teal-fonce); }
    .gris { color: var(--gris); }

    .bouton { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--rose); color: #fff !important; text-decoration: none; font-weight: 500; }
    .bouton:hover { opacity: .9; }

    /* Photos du devoir */
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .photos figure { margin: 0; border: 1px solid #e3e8e8; border-radius: 10px; overflow: hidden; }
    .photos img { width: 100%; display: block; }
    .photos figcaption { padding: 8px 12px; color: var(--gris); font-size: .95rem; }

    @media (max-width: 800px) { .photos { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .contenu { padding: 16px; } .photos { grid-template-columns: 1fr; } }
  </style>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
</head>

<body>

  <!-- Barre de navigation (chargée depuis nav.html) -->
  <div id="nav-placeholder"></div>
  <script>
    $(function () {
      $("#nav-placeholder").load("nav.html", function () {
        $('#mySidebar a[href="module2-4.html"]').addClass("actif");
      });
    });
  </script>

  <div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" id="myOverlay"></div>

  <div class="w3-main" style="margin-left:250px;">

    <div id="myTop" class="w3-container w3-top w3-theme w3-large">
      <p><i class="fa fa-bars w3-button w3-teal w3-hide-large w3-xlarge" onclick="w3_open()"></i>
      <span id="myIntro" class="w3-hide">MDM4U – Travail 2.4</span></p>
    </div>

    <header class="w3-container w3-theme" style="padding:64px 32px">
      <h1 class="w3-xxxlarge">2.4 – La distribution normale</h1>
    </header>

    <main class="contenu">

      <!-- Partie papier-crayon -->
      <section class="carte">
        <h2><i class="fa fa-pencil"></i> Devoir 2.4 – partie papier-crayon</h2>
        <div class="photos">
          <figure>
            <img src="IMG_2906%202.jpg" alt="Devoir 2.4, page 1">
            <figcaption>Page 1</figcaption>
          </figure>
          <figure>
            <img src="IMG_2907%202.jpg" alt="Devoir 2.4, page 2">
            <figcaption>Page 2</figcaption>
          </figure>
          <figure>
            <img src="IMG_2909.jpg" alt="Devoir 2.4, page 3">
            <figcaption>Page 3</figcaption>
          </figure>
        </div>
      </section>

      <!-- Partie technologie -->
      <section class="carte">
        <h2><i class="fa fa-file-text-o"></i> Devoir 2.4B – partie technologie</h2>
        <p class="gris">Mon travail est dans un document Google.</p>
        <a class="bouton" href="https://docs.google.com/document/d/1ME1hv4-PGO5Io0OfhZ-kkcQjcR-CLbW-uWpNwZoiV3Y/edit?tab=t.0" target="_blank" rel="noopener">
          Ouvrir le devoir 2.4B <i class="fa fa-external-link"></i>
        </a>
      </section>

    </main>

    <footer class="w3-container w3-theme" style="padding:32px">
      <p>Contenu de cette page web par Jimi</p>
    </footer>

  </div>

  <script>
    // Menu sur téléphone
    function w3_open() {
      document.getElementById("mySidebar").style.display = "block";
      document.getElementById("myOverlay").style.display = "block";
    }
    function w3_close() {
      document.getElementById("mySidebar").style.display = "none";
      document.getElementById("myOverlay").style.display = "none";
    }

    // Barre du haut quand on défile
    window.onscroll = function () {
      var bas = document.documentElement.scrollTop > 80;
      document.getElementById("myTop").classList.toggle("w3-card-4", bas);
      document.getElementById("myIntro").classList.toggle("w3-show-inline-block", bas);
    };
  </script>

</body>
</html>
